name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web-check:
    name: Web version still builds (MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx prisma generate && npx tsc --noEmit
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: web-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos-apple-silicon, os: macos-14 }
          - { name: macos-intel, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds; see README to sign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build backend (SQLite) + frontend
        run: node desktop/scripts/prepare.mjs
      - name: Package app
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: 9drive-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
          if-no-files-found: error
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
